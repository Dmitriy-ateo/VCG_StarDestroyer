<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Star Destroyer: Single Shot — A premium tactical spatial puzzle game. Upgrade your laser intensity, aims, and chassis capacity to calibrate beams, bypass defense matrices, and vaporize targeted planets!">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Star Destroyer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Star Destroyer: Single Shot</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #05050A;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      /* Glowing background stars for the desktop browser backdrop */
      background-image: 
        radial-gradient(1px 1px at 40px 80px, #fff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 120px 240px, rgba(255, 255, 255, 0.8), rgba(0,0,0,0)),
        radial-gradient(1px 1px at 300px 180px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 450px 320px, rgba(0, 255, 245, 0.3), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 600px 140px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 780px 290px, rgba(255, 46, 147, 0.2), rgba(0,0,0,0)),
        radial-gradient(1px 1px at 900px 420px, #fff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 1100px 220px, #fff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 600px 600px;
      animation: backdrop-drift 120s linear infinite;
    }

    @keyframes backdrop-drift {
      from { background-position: 0 0; }
      to { background-position: 600px 600px; }
    }

    /* Core responsive layout constraints for both Loader and Flutter Canvas */
    #loading-container, flutter-view {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      box-sizing: border-box;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Desktop/Tablet Wide screens: Center and wrap inside premium vertical viewport */
    @media (min-width: 481px) {
      #loading-container, flutter-view {
        max-width: 450px !important;
        max-height: 880px !important;
        width: 100% !important;
        height: 92vh !important;
        border-radius: 20px !important;
        border: 2px solid rgba(0, 255, 245, 0.3) !important;
        box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.8), 
                    0 0 30px rgba(0, 255, 245, 0.2) !important;
        overflow: hidden !important;
      }
    }

    /* Mobile screens: Render native edge-to-edge */
    @media (max-width: 480px) {
      #loading-container, flutter-view {
        width: 100vw !important;
        height: 100vh !important;
        max-width: 100vw !important;
        max-height: 100vh !important;
        border-radius: 0px !important;
        border: none !important;
      }
    }

    #loading-container {
      background-color: #080710;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    .loader-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    .game-title {
      color: #00FFF5;
      font-size: 2.2rem;
      letter-spacing: 0.4rem;
      margin-bottom: 2.5rem;
      font-weight: 900;
      text-shadow: 0 0 10px rgba(0, 255, 245, 0.8), 0 0 20px rgba(0, 255, 245, 0.4);
      animation: title-flicker 3s infinite alternate;
    }

    .laser-emitter {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 2.5rem;
    }

    .laser-core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      background-color: #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 0 15px #FFFFFF, 0 0 30px #FF2E93, 0 0 45px #FF2E93;
      animation: pulse-core 1.5s infinite ease-in-out alternate;
    }

    .laser-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid transparent;
      border-top-color: #00FFF5;
      border-bottom-color: #00FFF5;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 255, 245, 0.3);
      animation: spin-ring 2s linear infinite;
    }

    .loading-status {
      color: #FF2E93;
      font-size: 0.9rem;
      letter-spacing: 0.15rem;
      text-shadow: 0 0 8px rgba(255, 46, 147, 0.6);
      display: flex;
      align-items: center;
      font-weight: bold;
    }

    .status-text {
      animation: pulse-text 1.5s infinite alternate;
    }

    .dots::after {
      content: '';
      animation: loading-dots 1.5s infinite;
    }

    /* Animations */
    @keyframes spin-ring {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse-core {
      0% {
        transform: translate(-50%, -50%) scale(0.85);
        box-shadow: 0 0 10px #FFFFFF, 0 0 20px #FF2E93, 0 0 30px #FF2E93;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.15);
        box-shadow: 0 0 20px #FFFFFF, 0 0 35px #FF2E93, 0 0 55px #FF2E93;
      }
    }

    @keyframes pulse-text {
      0% { opacity: 0.6; }
      100% { opacity: 1.0; }
    }

    @keyframes loading-dots {
      0% { content: ''; }
      33% { content: '.'; }
      66% { content: '..'; }
      100% { content: '...'; }
    }

    @keyframes title-flicker {
      0%, 100% { opacity: 0.95; }
      45% { opacity: 0.95; }
      46% { opacity: 0.3; }
      47% { opacity: 0.95; }
      48% { opacity: 0.95; }
      78% { opacity: 0.95; }
      79% { opacity: 0.3; }
      80% { opacity: 0.95; }
    }

    /* Starfield details */
    .space-stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 50px 160px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 80px 120px, rgba(0, 255, 245, 0.4), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 110px 210px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 150px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 220px 80px, rgba(255, 46, 147, 0.3), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 240px 150px, #fff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 300px 300px;
      opacity: 0.25;
      animation: drift 60s linear infinite;
    }

    @keyframes drift {
      from { background-position: 0 0; }
      to { background-position: 300px 600px; }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="space-stars"></div>
    <div class="loader-content">
      <h1 class="game-title">STAR DESTROYER</h1>
      <div class="laser-emitter">
        <div class="laser-core"></div>
        <div class="laser-ring"></div>
      </div>
      <div class="loading-status">
        <span class="status-text">CALIBRATING TACTICAL SYSTEMS</span>
        <span class="dots"></span>
      </div>
    </div>
  </div>

  <script>
    // MutationObserver to detect when Flutter mounts the canvas or view
    (function() {
      const initialCheck = document.querySelector('flutter-view, canvas');
      if (initialCheck) {
        const loader = document.getElementById('loading-container');
        if (loader) loader.remove();
        return;
      }

      const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          for (const node of mutation.addedNodes) {
            if (node.tagName === 'FLUTTER-VIEW' || node.tagName === 'CANVAS' || node.id === 'flutter_container') {
              const loader = document.getElementById('loading-container');
              if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => {
                  loader.remove();
                }, 600);
                observer.disconnect();
                return;
              }
            }
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
